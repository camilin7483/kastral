name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Motores nativos que exigen los tests (Ghostscript, FFmpeg)
      - name: Instalar motores (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ghostscript ffmpeg
      - name: Instalar motores (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg ghostscript -y
      - name: Añadir Ghostscript al PATH (Windows)
        if: runner.os == 'Windows'
        run: $gs = Get-ChildItem 'C:\Program Files\gs\gs*' -Directory | Select-Object -First 1; "$($gs.FullName)\bin" | Out-File -Append $env:GITHUB_PATH
        shell: pwsh
      - run: bun install
      - name: Instalar dependencias Python (tests backend)
        run: python -m pip install -r backend/requirements.txt
      - run: bunx tsc --noEmit
      - run: bunx eslint . --max-warnings 100
      - run: bun test lib/
      - run: python -m pytest backend -q
      - run: bun run build
