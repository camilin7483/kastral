name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bun install
      - run: bunx tsc --noEmit
      - run: bunx eslint . --max-warnings 100
      - run: bun test lib/
      - run: python3 -m pytest backend -q
      - run: bun run build
