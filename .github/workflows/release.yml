name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: choco install ghostscript --version 10.5.1 -y
      - run: .\scripts\ci-fetch-sidecars.ps1
      # Windows bundles Ghostscript too: enable its sidecar only on this runner
      # (repo keeps externalBin ffmpeg-only so Linux dev/builds don't require a gs binary file).
      - run: python -c "import json;p='src-tauri/tauri.conf.json';d=json.load(open(p));d['bundle']['externalBin']=['binaries/ffmpeg','binaries/gs'];json.dump(d,open(p,'w'),indent=2)"
        shell: pwsh
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: kastral-windows-setup
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem "$dir/*-setup.exe" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content "$dir/SHA256SUMS" -Encoding ascii
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ghostscript build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bash scripts/ci-fetch-sidecars.sh
      - uses: tauri-apps/tauri-action@v0
        with:
          args: --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: kastral-linux-packages
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Generate SHA256SUMS
        run: |
          cd src-tauri/target/release/bundle
          sha256sum deb/*.deb appimage/*.AppImage > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/SHA256SUMS
